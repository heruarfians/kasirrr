<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#008080">
      <title>Kasirrr · Warung</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E☕%3C/text%3E%3C/svg%3E">
  </head>
    <body>
      <div id="loginScreen"></div>
      <div id="application" hidden>
        <header><b>▦ KASIRRR</b>
          <small>BAKMIE & WARKOP</small>
          <span id="clock"></span>
        </header>
        <div class="desktop">
          <aside>
            <div class="brand">☕<h2>Kasirrr</h2><p>Makan Kenyang. Ngopi Tenang</p></div>
              <small class="label">KASIRRR WARUNG</small>
              <nav id="nav"></nav>
              <div class="side-bottom">
                <span id="identity"></span>
                <p>v2.0 · edition</p>
              </div>
          </aside>
          <main>
            <div class="heading"><div>
              <small class="eyebrow" id="outletLabel"></small>
              <h1 id="pageTitle"></h1>
              <p id="subtitle"></p>
            </div>
              <button data-action="switch">◷ Ganti akun</button>
            </div>
            <div id="stats" class="stats"></div>
            <div id="content"></div>
            <footer>
              <span id="connection"></span>
              <span id="sync"></span>
            </footer>
          </main>
        </div>
        <div class="taskbar">
          <button data-action="home">▦ Mulai</button>
          <span>☕ Kasirrr — Warung TKM</span>
          <small id="userBadge"></small>
        </div>
      </div>
      <dialog id="modal">
        <div class="titlebar"><b id="modalTitle"></b>
          <button data-action="close" aria-label="Tutup">×</button>
        </div>
        <div id="modalBody"></div>
      </dialog>
      <div id="toast" role="status"></div>
      <script src="./config.js"></script>
      <script src="./core.js"></script>
      <script src="./xlsx.js"></script>
      <script src="./app.js"></script>
    </body>
</html>
